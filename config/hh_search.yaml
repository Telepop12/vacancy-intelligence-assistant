# ---------------------------------------------------------------------------
# Настройки автопоиска вакансий на hh.ru (используется agents/hh_search.py)
# ---------------------------------------------------------------------------

# Поисковые запросы — каждый выполняется отдельно, результаты объединяются
queries:
  - "CIO"
  - "CDTO"
  - "Директор по информационным технологиям"
  - "Директор по ИТ"
  - "Директор по цифровой трансформации"
  - "ИТ-директор"
  - "Руководитель ИТ-департамента"

# Регион поиска (id справочника hh.ru): 113 — Россия, 1 — Москва, 2 — СПб
area: 113

# Где искать текст запроса: name — только в названии вакансии (меньше шума)
search_field: name

# Сколько страниц выдачи (по ~50 вакансий) брать на каждый запрос
max_pages_per_query: 1

# Лимит новых вакансий, обрабатываемых за один запуск
# (каждая новая вакансия = один запрос полного описания к hh.ru)
max_new_per_run: 30
