# ---------------------------------------------------------------------------
# Варианты резюме для hh.ru (используется agents/resume_variants.py)
#
# Идея: на hh.ru нельзя откликаться свежесгенерированным резюме под каждую
# вакансию (модерация ~10 минут). Вместо этого держим 2–5 постоянных
# вариантов под архетипы ролей — они проходят модерацию один раз.
# Система генерирует контент вариантов из канонического резюме,
# НЕ выдумывая фактов — только переакцентируя реальный опыт.
# ---------------------------------------------------------------------------

# Каноническое резюме (истина в последней инстанции по фактам)
resume_file: data/resume/Гришкин_ВЕ_актуальное.docx

variants:
  cio:
    name: "CIO — классический ИТ-директор"
    hh_title_hint: "Директор по информационным технологиям (CIO)"
    focus: >
      Классическое ИТ-руководство: ИТ-стратегия, управление ИТ-бюджетом,
      построение и развитие ИТ-команды, инфраструктура, ERP/корпоративные
      системы, ИТ-сервисы (ITSM/ITIL), информационная безопасность,
      взаимодействие с советом директоров и бизнес-заказчиками.
    deemphasize: >
      Узкотехнические детали разработки; исследовательские AI-проекты
      упоминать как часть ИТ-стратегии, не как главный фокус.

  cto:
    name: "CTO — технический директор (разработка)"
    hh_title_hint: "Технический директор (CTO)"
    focus: >
      Руководство разработкой: продуктовые и инженерные команды, архитектура
      систем, технологический стек, инженерная культура и процессы
      (DevOps, CI/CD), качество и скорость поставки, техническое лидерство,
      выбор технологий, интеграции.
    deemphasize: >
      Административно-хозяйственный ИТ-контур (закупки, хелпдеск,
      офисная инфраструктура) — упоминать кратко.

  cdto:
    name: "CDTO — цифровая трансформация и управление данными"
    hh_title_hint: "Директор по цифровой трансформации (CDTO)"
    focus: >
      Цифровая трансформация бизнес-процессов, управление данными
      (данные как актив, MDM, BI, аналитика, качество данных),
      автоматизация сквозных процессов, изменение операционной модели,
      цифровые продукты, управление портфелем трансформационных проектов,
      измеримый бизнес-эффект (ROI, снижение издержек).
    deemphasize: >
      Поддерживающая ИТ-инфраструктура — только как фундамент трансформации.

  caio:
    name: "CAIO — руководитель по искусственному интеллекту"
    hh_title_hint: "Директор по искусственному интеллекту (CAIO)"
    focus: >
      Внедрение и владение ИИ-направлением: стратегия применения ИИ,
      генеративный ИИ и LLM-решения, ИИ-агенты, автоматизация на базе ИИ,
      данные для ИИ, оценка эффекта ИИ-инициатив, управление ИИ-рисками
      и качеством, обучение команд работе с ИИ.
    deemphasize: >
      Классический ИТ-контур — как база доверия, кратко. Честно
      разграничивать: реализованные ИИ-проекты vs изучаемые технологии.

  universal:
    name: "Универсальный — руководитель ИТ/цифровизации широкого профиля"
    hh_title_hint: "Руководитель по ИТ / цифровой трансформации"
    focus: >
      Сбалансированный портрет «мастера на все руки»: стратегия + операционка,
      ИТ + данные + ИИ, трансформация + стабильность. Для нестандартных ролей
      (COO с ИТ-уклоном, заместитель ГД по развитию, ИТ-директор холдинга
      с широким мандатом).
    deemphasize: >
      Ничего не прятать, но избегать перегруза детали — широта важнее глубины.

# Параметры генерации
about_max_chars: 900        # блок «О себе» для hh
bullets_per_position: 4     # акцентов на позицию (для ключевых позиций)
key_skills_count: 15        # навыков в списке (лимит hh — до 30)
