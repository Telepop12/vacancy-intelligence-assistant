# ---------------------------------------------------------------------------
# LLM-настройки (используется core/llm.py — единый шлюз для всех генераторов)
# Папка config примонтирована в контейнер: смена модели = правка + рестарт,
# без пересборки образа.
# ---------------------------------------------------------------------------

# Модель для всех LLM-вызовов (анализ, матч, варианты, письма, подготовка).
# claude-sonnet-5 — актуальный Sonnet (сменил claude-sonnet-4-6, август 2026):
# качество ближе к Opus, вводная цена $2/$10 за млн токенов до 31.08.2026
# (у 4.6 было $3/$15). Алиас без даты сам указывает на свежий снапшот.
model: claude-sonnet-5

# Модель по назначению вызова — переопределяет model для отдельных генераторов.
# prep — пакет подготовки к интервью (8 этапов, окошки «Спросить ИИ», двойник):
# решение заказчика 22.09.2026 — Opus 5 ($5/$25 за млн токенов против $2/$10
# у Sonnet 5), качество подготовки важнее цены. Остальное — на model выше.
# Файл примонтирован: правка + рестарт контейнера, без пересборки образа.
models:
  prep: claude-opus-5

# Глубина рассуждений: у Sonnet 5 medium ≈ по интеллекту high у Sonnet 4.6,
# но дешевле и быстрее. Поднять до high/xhigh, если качество где-то просядет.
effort: medium

# Нижний порог max_tokens: у Sonnet 5 «мышление» расходует max_tokens вместе
# с текстом ответа + новый токенизатор даёт ~+30% токенов на тот же текст.
min_max_tokens: 6000

# Сколько раз повторять запрос при невалидном/оборванном JSON (сверх первого)
max_json_retries: 1
