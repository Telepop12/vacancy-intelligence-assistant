# ---------------------------------------------------------------------------
# Таргет-лист работодателей для обходчика карьерных страниц
# (agents/career_watch.py). Согласован заказчиком 2026-09-02: крупный бизнес,
# три группы — 1 пром/агро/химия/добыча, 2 ИТ-интеграторы и телеком,
# 3 финтех/логистика/прочее. Разведка страниц — 02.09.2026.
#
# channel:
#   site — карьерная страница компании: ссылки на вакансии из HTML
#          (link_pattern — регулярка по пути ссылки) и/или встроенный JSON
#          (json_scan: true — __NEXT_DATA__/__INITIAL_STATE__; api_url — JSON API)
#   hh   — вакансии работодателя через hh.ru (JS-сайты, антибот, «только hh»);
#          один запрос поиска на компанию: hh_query по названию вакансии
#   off  — временно не обходить
#
# Фильтр названий (регулярки, без учёта регистра): вакансия попадает в триаж,
# если название совпало с title_include и не совпало с title_exclude.
# ---------------------------------------------------------------------------

title_include:
  # Сильные титулы — проходят сами по себе (C-level аббревиатуры)
  - "\\bcio\\b"
  - "\\bcto\\b"
  - "\\bcdo\\b"
  - "\\bcdto\\b"
  - "\\bcaio\\b"
  - "\\bvp\\b"
  - "vice president"
  - "технический директор"
  - "ит-директор"
  - "it-директор"

# Слабые титулы — только вместе с ИТ/цифровым контекстом (title_context).
# «Директор» тоже слабый: у промышленных и агрохолдингов «Директор по
# производству / по качеству» — не наш профиль.
title_include_weak:
  - "директор"
  - "руководител"
  - "начальник"
  - "заместител"
  - "\\bhead\\b"
  - "\\bchief\\b"
  - "лидер"

title_context:
  - "\\bит\\b"
  - "\\bit\\b"
  - "информац"
  - "цифров"
  - "digital"
  - "технолог"
  - "данн"
  - "\\bdata\\b"
  - "разработ"
  - "инфраструктур"
  - "автоматиз"
  - "трансформац"
  - "\\bai\\b"
  - "\\bml\\b"
  - "машинн"
  - "искусственн"
  - "аналитик"
  - "\\berp\\b"
  - "\\bsap\\b"
  - "\\b1с\\b"
  - "\\b1c\\b"
  - "платформ"
  - "программн"
  - "\\bpmo\\b"
  - "проектного офиса"

title_exclude:
  - "стаж[её]р"
  - "junior"
  - "младш"
  - "оператор"
  - "продаж"
  - "\\bводител"   # по границе слова: иначе ловит «руко-водител-ь»
  - "кладов"
  - "курьер"
  - "грузчик"
  - "^технолог"
  - "инженер-технолог"
  - "лаборант"
  - "смен[ыа]"
  - "участк"
  - "цех"

# Запрос по названию для канала hh (синтаксис hh: OR между словами)
hh_query_default: "директор OR руководитель OR начальник OR CIO OR CTO OR CDTO OR CDO OR head"

# Не больше стольких новых вакансий загружать с одной компании за прогон
max_new_per_company: 10
# Не больше стольких hh-компаний опрашивать за прогон (анти-бот hh)
max_hh_companies_per_run: 8

