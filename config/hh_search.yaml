# ---------------------------------------------------------------------------
# Настройки автопоиска вакансий на hh.ru (используется agents/hh_search.py)
# ---------------------------------------------------------------------------

# Поисковые запросы — каждый выполняется отдельно, результаты объединяются.
# Покрывают три архетипа опубликованных резюме: CIO, CDTO/CDO, CTO —
# плюс «промышленные» титулы (директор департамента, начальник управления).
queries:
  # CIO-архетип
  - "CIO"
  - "Директор по информационным технологиям"
  - "Директор по ИТ"
  - "ИТ-директор"
  - "Руководитель ИТ-департамента"
  - "Директор департамента информационных технологий"
  - "Начальник управления информационных технологий"
  # CDTO/CDO-архетип
  - "CDTO"
  - "Директор по цифровой трансформации"
  - "Директор по цифровизации"
  - "Директор по данным"
  # CTO-архетип
  - "CTO"
  - "Технический директор"

# Регион поиска (id справочника hh.ru): 113 — Россия, 1 — Москва, 2 — СПб
area: 1

# Где искать текст запроса: name — только в названии вакансии (меньше шума)
search_field: name

# Сортировка выдачи: publication_time — свежие первыми (критично для
# мониторинга; сортировка «по соответствию» отдаёт стабильный топ-50,
# в котором новые вакансии могут не появиться вовсе)
order_by: publication_time

# Сколько страниц выдачи (по ~50 вакансий) брать на каждый запрос
max_pages_per_query: 1

# Лимит новых вакансий, обрабатываемых за один запуск
# (каждая новая вакансия = один запрос полного описания к hh.ru;
# 30 упиралось в потолок три запуска подряд — хвост выдачи терялся)
max_new_per_run: 50
