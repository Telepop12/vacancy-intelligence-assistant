# ---------------------------------------------------------------------------
# Мониторинг новых вакансий (agents/monitor.py)
# Папка config примонтирована в контейнер: правки применяются рестартом.
# ---------------------------------------------------------------------------

# Включён ли фоновый мониторинг (шедулер в веб-приложении)
enabled: true

# Интервал между циклами, часов (первый цикл — через интервал после старта)
interval_hours: 6

# Порог балла: вакансии с triage-score >= порога попадают в дайджест
# и получают автосгенерированный пакет отклика
score_threshold: 60

# Максимум автопакетов за один цикл (защита от всплеска расходов на LLM:
# каждый пакет — 2 вызова Sonnet; остальные вакансии попадут в дайджест
# без пакета, пакет сгенерируется при открытии)
max_packages_per_cycle: 3

# Какой давности триаж ещё считается «новым» для дайджеста и алертов.
# Покрывает находки ручного поиска между циклами (48 ч = два дня с запасом).
lookback_hours: 48

# Telegram-алерты: токен бота кладётся в .env (TG_BOT_TOKEN=...),
# chat_id определяется автоматически после первого сообщения боту.
# Если токена нет — алерты не шлются, дайджест копится на странице «Новое».
