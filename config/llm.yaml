# Единый маршрутизатор core/llm.py. Папка config примонтирована в контейнер:
# смена моделей вступает в силу после рестарта, пересборка не нужна.
provider: ollama

# Обычные операции остаются локально: резюме, матч, варианты и письма.
providers:
  ollama:
    model: gemma4:26b
    base_url: http://127.0.0.1:11434
    timeout: 300
    keep_alive: 15m
    think: false
    min_max_tokens: 4000

  # Подготовка к интервью и web research. Нужен OPENAI_API_KEY в .env.
  openai:
    model: gpt-6-astra
    effort: medium
    timeout: 600
    max_retries: 2
    min_max_tokens: 6000

routes:
  prep: openai

# Число повторов после невалидного или оборванного JSON.
max_json_retries: 1
